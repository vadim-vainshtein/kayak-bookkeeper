<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kayak Bookkeeper</title>
  <style>
    :root { color: #16201d; background: #f5f7f6; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; } body { margin: 0; } button, input { font: inherit; }
    .shell { max-width: 1080px; margin: 0 auto; padding: 28px 20px 52px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 28px; }
    h1, h2, h3, p { margin-top: 0; } h1 { font-size: 24px; letter-spacing: -.04em; margin-bottom: 4px; } h2 { font-size: 20px; }
    .muted { color: #66716d; } .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    button { border: 0; border-radius: 8px; padding: 9px 13px; cursor: pointer; background: #e7ece9; color: #16201d; }
    button.primary { background: #145a42; color: #fff; } button.active { background: #d3e9df; color: #0d4935; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); gap: 16px; }
    .card { background: #fff; border: 1px solid #e2e8e5; border-radius: 12px; padding: 18px; }
    .card.wide { grid-column: 1 / -1; } .metric { font-size: 28px; font-weight: 700; }
    .list { margin: 0; padding: 0; list-style: none; } .list li { padding: 12px 0; border-top: 1px solid #edf0ee; }
    .list li:first-child { border-top: 0; } .line { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    form { display: grid; gap: 10px; } label { display: grid; gap: 5px; font-size: 13px; color: #52605b; }
    input { border: 1px solid #cfd8d3; border-radius: 7px; padding: 9px 10px; color: #16201d; background: #fff; }
    .notice { margin: 0 0 16px; padding: 10px 12px; border-radius: 8px; background: #fff1ee; color: #9a2f1f; }
    .login { max-width: 360px; margin: 12vh auto; } .login .card { padding: 24px; }
    @media (max-width: 560px) { .topbar { align-items: flex-start; flex-direction: column; } .shell { padding-top: 20px; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/webjars/react/18.3.1/umd/react.production.min.js"></script>
  <script src="/webjars/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script>
    const { useEffect, useState } = React;
    const { createRoot } = ReactDOM;
    const h = React.createElement;
    const basicAuth = (login, password) => "Basic " + btoa(String.fromCharCode(...new TextEncoder().encode(login + ":" + password)));
    const formatDate = value => value ? new Intl.DateTimeFormat("ru-RU", { dateStyle: "medium", timeStyle: value.includes("T") ? "short" : undefined }).format(new Date(value)) : "—";

    function Login({ onLogin }) {
      const [login, setLogin] = useState("admin");
      const [password, setPassword] = useState("admin");
      const [error, setError] = useState("");
      async function submit(event) {
        event.preventDefault();
        const auth = basicAuth(login, password);
        const response = await fetch("/api/people", { headers: { Authorization: auth } });
        if (!response.ok) return setError("Неверный логин или пароль.");
        onLogin(auth, login);
      }
      return h("main", { className: "shell login" }, h("section", { className: "card" },
        h("h1", null, "Kayak Bookkeeper"), h("p", { className: "muted" }, "Войдите, чтобы управлять клубом."),
        error && h("p", { className: "notice" }, error),
        h("form", { onSubmit: submit },
          h("label", null, "Логин", h("input", { value: login, onChange: e => setLogin(e.target.value), autoComplete: "username", required: true })),
          h("label", null, "Пароль", h("input", { type: "password", value: password, onChange: e => setPassword(e.target.value), autoComplete: "current-password", required: true })),
          h("button", { className: "primary", type: "submit" }, "Войти"))));
    }

    function App() {
      const [auth, setAuth] = useState(null);
      const [user, setUser] = useState("admin");
      const [tab, setTab] = useState("overview");
      const [people, setPeople] = useState([]);
      const [subscriptions, setSubscriptions] = useState([]);
      const [rates, setRates] = useState([]);
      const [error, setError] = useState("");
      const [message, setMessage] = useState("");
      const [loading, setLoading] = useState(false);

      const api = async (path, options = {}) => {
        const response = await fetch(path, { ...options, headers: { "Content-Type": "application/json", Authorization: auth, ...(options.headers || {}) } });
        if (response.status === 401) { setAuth(null); throw new Error("Сессия завершена."); }
        if (!response.ok) { const body = await response.json().catch(() => ({})); throw new Error(body.message || "Не удалось выполнить запрос."); }
        return response.status === 204 ? null : response.json();
      };
      const load = async () => {
        setLoading(true); setError("");
        try { const [p, s, r] = await Promise.all([api("/api/people"), api("/api/subscriptions"), api("/api/pricing-rates")]); setPeople(p); setSubscriptions(s); setRates(r); }
        catch (e) { setError(e.message); } finally { setLoading(false); }
      };
      useEffect(() => { if (auth) load(); }, [auth]);
      if (!auth) return h(Login, { onLogin: (newAuth, login) => { setAuth(newAuth); setUser(login); } });
      const addPerson = async event => {
        event.preventDefault(); const form = new FormData(event.currentTarget);
        try { await api("/api/people", { method: "POST", body: JSON.stringify({ fullName: form.get("fullName"), phone: form.get("phone") || null, note: null }) }); event.currentTarget.reset(); await load(); }
        catch (e) { setError(e.message); }
      };
      const changePassword = async event => {
        event.preventDefault(); const form = new FormData(event.currentTarget);
        const newPassword = form.get("newPassword");
        try {
          await api("/api/account/password", { method: "PUT", body: JSON.stringify({ currentPassword: form.get("currentPassword"), newPassword }) });
          setAuth(basicAuth(user, newPassword)); setMessage("Пароль обновлён. Он не сохраняется в браузере."); event.currentTarget.reset();
        } catch (e) { setError(e.message); }
      };
      const content = tab === "people" ? h("div", { className: "grid" },
        h("section", { className: "card" }, h("h2", null, "Новый каякер"), h("form", { onSubmit: addPerson },
          h("label", null, "Имя", h("input", { name: "fullName", required: true, placeholder: "Имя и фамилия" })),
          h("label", null, "Телефон", h("input", { name: "phone", placeholder: "+7…" })), h("button", { className: "primary" }, "Добавить"))),
        h("section", { className: "card" }, h("h2", null, "Каякеры"), h("ul", { className: "list" }, people.map(person => h("li", { key: person.id }, h("div", { className: "line" }, h("strong", null, person.fullName), h("span", { className: "muted" }, person.active ? "активен" : "неактивен")), h("small", { className: "muted" }, person.phone || "Телефон не указан"))))))
        : tab === "subscriptions" ? h("section", { className: "card" }, h("h2", null, "Абонементы"), h("ul", { className: "list" }, subscriptions.map(subscription => h("li", { key: subscription.id }, h("div", { className: "line" }, h("strong", null, subscription.title || "Без названия"), h("span", { className: "muted" }, subscription.status)), h("div", { className: "muted" }, `${subscription.members.length}/${subscription.capacity} участников · ${subscription.sessions.length} тренировок`), subscription.sessions[0] && h("small", { className: "muted" }, "Начало: " + formatDate(subscription.sessions[0].startsAt))))))
        : tab === "rates" ? h("section", { className: "card" }, h("h2", null, "Тарифы"), h("ul", { className: "list" }, rates.map(rate => h("li", { key: rate.id }, h("div", { className: "line" }, h("strong", null, rate.code), h("span", null, new Intl.NumberFormat("ru-RU").format(rate.amount) + " ₸")), h("small", { className: "muted" }, `${formatDate(rate.effectiveFrom)} — ${formatDate(rate.effectiveTo)}`)))))
        : tab === "password" ? h("section", { className: "card" }, h("h2", null, "Сменить пароль"), h("p", { className: "muted" }, "Новый пароль должен содержать от 8 до 72 символов."), h("form", { onSubmit: changePassword },
          h("label", null, "Текущий пароль", h("input", { name: "currentPassword", type: "password", autoComplete: "current-password", required: true })),
          h("label", null, "Новый пароль", h("input", { name: "newPassword", type: "password", minLength: 8, maxLength: 72, autoComplete: "new-password", required: true })),
          h("button", { className: "primary", type: "submit" }, "Обновить пароль")))
        : h("div", { className: "grid" },
          h("section", { className: "card" }, h("h3", null, "Каякеры"), h("div", { className: "metric" }, people.filter(person => person.active).length), h("p", { className: "muted" }, "активных")),
          h("section", { className: "card" }, h("h3", null, "Абонементы"), h("div", { className: "metric" }, subscriptions.length), h("p", { className: "muted" }, "всего")),
          h("section", { className: "card" }, h("h3", null, "Тарифы"), h("div", { className: "metric" }, rates.length), h("p", { className: "muted" }, "настроено")),
          h("section", { className: "card wide" }, h("h2", null, "Быстрый старт"), h("p", { className: "muted" }, "Добавьте каякеров, настройте тарифы и создайте абонемент через API или Swagger.")));
      return h("main", { className: "shell" },
        h("header", { className: "topbar" }, h("div", null, h("h1", null, "Kayak Bookkeeper"), h("span", { className: "muted" }, "Управление клубом")), h("div", null, h("span", { className: "muted" }, user + " · "), h("button", { onClick: () => setAuth(null) }, "Выйти"))),
        h("nav", { className: "tabs" }, [["overview", "Обзор"], ["people", "Каякеры"], ["subscriptions", "Абонементы"], ["rates", "Тарифы"], ["password", "Пароль"]].map(([id, title]) => h("button", { key: id, className: tab === id ? "active" : "", onClick: () => setTab(id) }, title))),
        h("div", { style: { height: "18px" } }), error && h("p", { className: "notice" }, error), message && h("p", { className: "notice", style: { background: "#e4f3eb", color: "#145a42" } }, message), loading ? h("p", { className: "muted" }, "Загрузка…") : content);
    }
    createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
