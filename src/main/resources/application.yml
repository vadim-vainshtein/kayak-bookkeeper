spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kayak_bookkeeper}
    username: ${DB_USER:kayak}
    password: ${DB_PASSWORD:kayak}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  error:
    include-message: always
