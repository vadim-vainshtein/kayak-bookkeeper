services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kayak_bookkeeper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
    ports:
      - "5450:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kayak_bookkeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
